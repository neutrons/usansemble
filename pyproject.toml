########################
### Project Metadata ###
########################
[project]
name = "usansemble"
description = "NiceGUI web app to assemble usansred JSON reduction configurations"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
keywords = ["neutrons", "usans", "usansred", "oncat", "nicegui"]
readme = "README.md"

dependencies = [
  # Dependencies available from both PyPI and conda should be listed here.
  # pyoncatng brings in its own ONCat stack (pyoncat, oauthlib, ...) transitively.
  "pyoncatng",
  "nicegui",
  "argcomplete",
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme", "versioningit", "myst_parser"]

[project.scripts]
usansemble = "usansemble.main:main"

[project.urls]
homepage = "https://github.com/neutrons/usansemble/"
repository = "https://github.com/neutrons/usansemble/"
documentation = "https://usansemble.readthedocs.io/"
issues = "https://github.com/neutrons/usansemble/issues"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/usansemble/_version.py"
build-file = "usansemble/_version.py"

[tool.hatch.build]
artifacts = [
  "src/usansemble/_version.py",
  "src/usansemble/**/*.yml",
  "src/usansemble/**/*.yaml",
  "src/usansemble/**/*.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usansemble"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"
# Since pixi builds currently require the package version to be set statically in pyproject.toml,
# and we solve that by temporarily changing pyproject.toml during build using the pixi tasks
# sync-version and reset-toml, then we need to ignore uncommitted changes in order for the wheel
# version to be consistent with the package version
dirty = "{version}"
distance-dirty = "{next_version}.dev{committer_date:%Y%m%d%H%M%S}"

[tool.versioningit.write]
file = "src/usansemble/_version.py"

###################
### Pixi config ###
###################

[tool.pixi.workspace]
preview = ["pixi-build"] # Required until the build feature becomes stable
channels = [
  "conda-forge",
  "neutrons/label/dev",                     # hosts the pyoncatng dev builds
  "oncat",                                  # hosts the pyoncat package (pulled in by pyoncatng)
  "https://prefix.dev/pixi-build-backends", # Required for pixi build
]
platforms = ["linux-64", "osx-arm64"] # add additional platforms as needed

## Dependency tables - https://pixi.sh/latest/reference/pixi_manifest/#the-dependencies-tables
## These tables override the dependencies listed in the [project] section

[tool.pixi.dependencies]
# Conda package dependencies
# pyoncatng widgets (brings pyoncat + ONCat auth stack transitively)
pyoncatng = "*"
# GUI
nicegui = "*"
# CLI shell completion
argcomplete = "*"
# Security-hardening version pins (CVE mitigations)
h2 = ">=4.3.0"               # Known vulnerability in <4.3.0
brotli = ">=1.2.0"
urllib3 = ">=2.6.3"          # Known vulnerability in <2.6.3
filelock = ">=3.20.3"        # Known vulnerability in <3.20.3
virtualenv = ">=20.36.1,<21" # Known vulnerability in <20.36.1; capped due to https://github.com/pypa/hatch/issues/2193
cryptography = ">=48.0.1"    # CVE-2026-26007, CVE-2026-39892, GHSA-537c-gmf6-5ccf
requests = ">=2.33.0"        # CVE-2026-25645
pillow = ">=12.3.0"          # CVE-2026-25990, CVE-2026-40192, PYSEC-2026-2255/2256/2257
msgpack-python = ">=1.2.1"   # GHSA-6v7p-g79w-8964

[tool.pixi.pypi-dependencies]
# PyPI dependencies, including this package to allow local editable installs
usansemble = { path = ".", editable = true }
jaraco-context = ">=6.1.0"                  # CVE-2026-23949

# Pixi Build configuration - https://pixi.sh/latest/reference/pixi_manifest/#pixi-build

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.10"
pyoncatng = "*"
nicegui = "*"
argcomplete = "*"

[tool.pixi.package]
name = "usansemble"
version = "0.0.0"  # placeholder, overwritten by sync-version

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

# Environments and Features

[tool.pixi.environments]
default = { features = [
  "docs",
  "developer",
  "package",
  "test",
], solve-group = "default" }
jupyter = { features = ["developer", "jupyter"], solve-group = "jupyter" }

[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.3"   # CVE-2025-71176 fixed in 9.0.3
pytest-cov = "*"
pytest-repeat = "*"
pytest-xdist = "*"
pytest-asyncio = "*" # required by nicegui.testing for widget tests

[tool.pixi.feature.package.dependencies]
versioningit = "*"

[tool.pixi.feature.package.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.developer.dependencies]
pip = ">=26.0"     # CVE-2026-1703
pre-commit = "*"
ruff = "*"
versioningit = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
myst-parser = "*"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
ipympl = "*"
ipywidgets = "*"

[tool.pixi.tasks]
# Application
start = { cmd = "python -m usansemble.main", description = "Launch the usansemble web app" }
# Documentation
build-docs = { cmd = 'sphinx-build -b html docs docs/_build', description = "Build documentation" }
test-docs = { cmd = "sphinx-build -M doctest docs docs/_build", description = "Test building the documentation" }
# Testing
test = { description = "Run the test suite", cmd = "pytest" }
# Packaging
conda-build-command = { cmd = "pixi publish --target-channel ./local-channel", description = "Build the conda package command" }
conda-build = { description = "Build the conda package", depends-on = [
  "backup-toml",
  "sync-version",
  "conda-build-command",
  "reset-toml",
] }
conda-publish = { cmd = "pixi upload anaconda --owner neutrons *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
  "conda-build",
] }
# Cleaning
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
  "clean",
  "clean-conda",
  "clean-docs",
] }
# workaround for dynamic versioning
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
backup-toml = { cmd = "cp pyproject.toml pyproject.toml.bak", description = "Backup the pyproject.toml file" }
reset-toml = { cmd = "cp pyproject.toml.bak pyproject.toml; rm pyproject.toml.bak", description = "Reset the pyproject.toml file to the original state" }

##############
### Pytest ###
##############

[tool.pytest.ini_options]
addopts = "-p nicegui.testing.user_plugin -v --cov=usansemble --cov-report=term-missing --cov-report=xml"
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test*.py"]
# nicegui.testing runs async fixtures/tests; auto mode avoids per-test markers
asyncio_mode = "auto"
# NiceGUI main file executed by the `user` fixture to register the pages under test
main_file = "tests/nicegui_main.py"
norecursedirs = [
  ".git",
  "tmp*",
  "_tmp*",
  "__pycache__",
  "*dataset*",
  "*data_set*",
]
markers = ["mymarker: example markers goes here"]

############
### Ruff ###
############

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb"]

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "BLE", "C90", "E", "F", "I", "N", "UP032", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["usansemble"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
